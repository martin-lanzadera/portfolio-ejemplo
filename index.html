<title>Art by Luzia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,800;1,400&display=swap">
<style>
  :root{
    --bg:#0B0B0C; --ink:#F4F2EE; --muted:#7E7C78; --line:#2A2A2C;
    --font:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ---- chrome ---- */
  .brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 28px);left:clamp(16px,3.5vw,52px);z-index:20;font-weight:800;font-size:26px;letter-spacing:-.02em}
  .brand span{color:var(--muted)}
  .menu-btn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 30px);right:clamp(16px,3.5vw,52px);z-index:30;background:none;border:0;color:var(--ink);cursor:pointer;padding:6px;font:inherit;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
  .menu-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .social{position:fixed;left:clamp(16px,3.5vw,52px);top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:22px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);writing-mode:vertical-rl;transform:translateY(-50%) rotate(180deg)}
  .social a:hover{color:var(--ink)}
  .progress{position:fixed;right:clamp(16px,3.5vw,52px);top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:14px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .progress .num{writing-mode:vertical-rl}
  .progress .bar{width:1px;height:190px;background:var(--line);position:relative}
  .progress .bar i{position:absolute;left:0;top:0;width:1px;height:0;background:var(--ink);transition:height .4s ease}
  .grid-btn{position:fixed;right:clamp(16px,3.5vw,52px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);z-index:20;width:18px;height:18px;display:grid;grid-template-columns:1fr 1fr;gap:3px;background:none;border:0;padding:0;cursor:pointer}
  .grid-btn b{background:var(--ink);display:block}
  .grid-btn:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
  @media (max-width:700px){.social{display:none}.progress .bar{height:110px}}

  /* ---- showcase ---- */
  .show{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
  .show::-webkit-scrollbar{display:none}
  .slide{height:100%;scroll-snap-align:start;display:grid;place-items:center;position:relative}
  .slide .frame{position:relative;width:min(66vw,1000px);aspect-ratio:16/8.5;max-height:74vh;overflow:hidden}
  @media (max-width:700px){.slide .frame{width:calc(100vw - 32px);aspect-ratio:3/4;max-height:70vh}}
  .slide .frame img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);transform:scale(1.06);transition:transform 1.2s ease, filter .8s ease, opacity .8s ease;opacity:.45}
  .slide.active .frame img{transform:scale(1);opacity:.85;filter:grayscale(.15) contrast(1.02)}
  .slide .cap{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
  .slide .cap .n{font-weight:800;font-size:clamp(16px,1.6vw,24px);margin-bottom:.2em;transform:translateX(-4.5em);opacity:.9}
  .slide .cap h2{margin:0;font-weight:800;font-size:clamp(52px,8.5vw,128px);line-height:1;letter-spacing:-.03em;color:transparent;-webkit-text-stroke:1px var(--ink);transition:color .5s ease .15s;text-wrap:balance}
  .slide.active .cap h2{color:var(--ink)}
  .slide .cap .cat{font-style:italic;font-size:clamp(14px,1.3vw,18px);color:var(--ink);margin-top:.9em;opacity:.85}
  .slide .cap a{pointer-events:auto}
  .slide .cap a:focus-visible h2{outline:2px solid var(--ink);outline-offset:8px}

  /* ---- final slide: sobre mí + contacto ---- */
  .slide.end{place-items:center}
  .end .inner{width:min(66vw,1000px);display:grid;grid-template-columns:220px 1fr;gap:clamp(24px,4vw,64px);align-items:end}
  .end img{aspect-ratio:3/4;object-fit:cover;filter:grayscale(1)}
  .end h2{font-weight:800;font-size:clamp(34px,4.5vw,64px);line-height:1;letter-spacing:-.03em;margin:0 0 18px}
  .end p{max-width:56ch;color:var(--ink);margin:0 0 14px;font-size:clamp(15px,1.15vw,17px)}
  .end .caps{color:var(--muted);font-size:13px;margin:0 0 26px}
  .end .mail{font-weight:800;font-size:clamp(22px,2.6vw,36px);letter-spacing:-.02em;border-bottom:2px solid var(--ink);display:inline-block}
  @media (max-width:700px){.end .inner{width:calc(100vw - 32px);grid-template-columns:1fr}.end img{max-width:160px}}

  /* ---- overlays ---- */
  .overlay{position:fixed;inset:0;background:var(--bg);z-index:25;display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 96px) clamp(16px,3.5vw,52px) 48px}
  .overlay.open{display:block}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;max-width:1300px;margin:0 auto}
  .thumbs a{display:block}
  .thumbs img{aspect-ratio:16/10;object-fit:cover;filter:grayscale(1);transition:filter .3s}
  .thumbs a:hover img{filter:none}
  .thumbs .t{display:flex;justify-content:space-between;font-size:13px;padding-top:8px;color:var(--muted)}
  .thumbs .t b{color:var(--ink);font-weight:500}
  /* ---- menú desplegable ---- */
  .dropdown{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);right:clamp(16px,3.5vw,52px);z-index:30;background:var(--bg);border:1px solid var(--line);min-width:200px;padding:8px 0;display:none}
  .dropdown.open{display:block}
  .dropdown a{display:block;padding:12px 22px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .dropdown a:hover,.dropdown a:focus-visible{color:var(--ink);background:var(--line);outline:none}

  /* ---- cabecera de galería y rejilla, con × a la izquierda del título ---- */
  .head{max-width:1100px;margin:0 auto 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .head .x{background:none;border:1px solid var(--line);color:var(--ink);cursor:pointer;width:44px;height:44px;border-radius:50%;font:inherit;font-size:22px;line-height:1;display:grid;place-items:center;flex:none}
  .head .x:hover{border-color:var(--ink)}
  .head .x:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .head h2{margin:0;font-weight:800;font-size:clamp(34px,5vw,64px);letter-spacing:-.03em;line-height:1}
  .head span{color:var(--muted);font-size:13px;flex-basis:100%;padding-left:62px}
  .thumbs{max-width:1100px}

  /* ---- cascada de proyectos de una vertical ---- */
  .cascade{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(12,1fr);gap:22px}
  .cascade a{display:block;grid-column:span 6}
  .cascade a:first-child{grid-column:span 12}
  .cascade a:nth-child(3n+2):not(:first-child){grid-column:span 7}
  .cascade a:nth-child(3n):not(:first-child){grid-column:span 5}
  .cascade img{width:100%;aspect-ratio:16/10;object-fit:cover;filter:grayscale(1);transition:filter .3s,transform .5s}
  .cascade a:first-child img{aspect-ratio:21/9}
  .cascade a:hover img{filter:none;transform:scale(1.01)}
  .cascade .t{display:flex;justify-content:space-between;gap:12px;padding-top:10px;font-size:13px;color:var(--muted)}
  .cascade .t b{color:var(--ink);font-weight:800;font-size:clamp(18px,1.6vw,24px);letter-spacing:-.02em;display:block}
  @media (max-width:700px){.cascade a,.cascade a:nth-child(n){grid-column:span 12}}

  /* ---- ficha de proyecto ---- */
  .ficha{max-width:1100px;margin:0 auto;display:grid;gap:18px}
  .ficha .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px 24px;padding:18px 0 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:8px}
  .ficha .meta small{display:block;color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px}
  .ficha .txt{max-width:62ch;font-size:clamp(15px,1.15vw,17px)}
  .ficha .res{max-width:62ch;border-left:2px solid var(--ink);padding-left:14px;color:var(--ink)}
  .ficha img{width:100%}
  .ficha .back{margin-top:28px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .ficha .back:hover{color:var(--ink)}

  /* ---- galería de proyecto ---- */
  .gal{z-index:26}
  .gal .pics{max-width:1100px;margin:0 auto;display:grid;gap:18px}
  .gal .pics img{width:100%}
</style>

<!-- El contenido vive en contenido.json y se edita desde /admin -->

<a class="brand" href="#s0" id="brand"></a>
<button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu">Menú</button>
<nav class="social" id="social" aria-label="Redes"></nav>
<div class="progress" aria-hidden="true"><span class="num" id="cur">01</span><div class="bar"><i id="fill"></i></div><span class="num" id="tot"></span></div>
<button class="grid-btn" id="grid-btn" aria-label="Ver todos los proyectos" aria-expanded="false" aria-controls="grid"><b></b><b></b><b></b><b></b></button>

<main class="show" id="show"></main>

<nav class="dropdown" id="menu" aria-label="Menú"></nav>
<div class="overlay" id="grid" role="dialog" aria-label="Todos los proyectos"><div class="head"><button class="x" data-x aria-label="Cerrar">×</button><h2>Proyectos</h2></div><div class="thumbs" id="thumbs"></div></div>
<div class="overlay" id="vert" role="dialog" aria-label="Proyectos de la vertical"><div class="head" id="vert-head"></div><div class="cascade" id="vert-list"></div></div>
<div class="overlay gal" id="ficha" role="dialog" aria-label="Ficha del proyecto"><div class="head" id="ficha-head"></div><div class="ficha" id="ficha-body"></div></div>

<script>
fetch('contenido.json?v=' + Date.now()).then(r => r.json()).then(C => {
  const $ = id => document.getElementById(id), pad = n => String(n).padStart(2,'0');
  C.enlaces = Object.fromEntries((C.enlaces || []).map(e => [e.nombre, e.url]));
  C.verticales.forEach(v => (v.proyectos || []).forEach(p => p.imagenes = (p.imagenes || []).map(x => typeof x === 'string' ? x : x.imagen).filter(Boolean)));
  const V = C.verticales.filter(v => v.proyectos && v.proyectos.length);
  const cover = v => v.portada || (v.proyectos[0] && v.proyectos[0].imagenes[0]) || '';
  $('brand').innerHTML = (C.marca || C.nombre) + '<span>.</span>';
  $('tot').textContent = pad(V.length);
  $('social').innerHTML = Object.entries(C.enlaces).map(([k,v]) => `<a href="${v}" target="_blank" rel="noopener">${k}</a>`).join('');

  // pantallas: una por vertical + ficha final
  $('show').innerHTML = V.map((v,i) => `
    <section class="slide" id="s${i}" data-i="${i}">
      <div class="frame">
        <img src="${cover(v)}" alt="${v.titulo}" ${i ? 'loading="lazy"' : ''}>
        <div class="cap"><a href="#s${i}" data-vert="${i}"><div class="n">${pad(i+1)}</div><h2>${v.titulo}</h2><div class="cat">${v.subtitulo || ''} · ${v.proyectos.length} ${v.proyectos.length === 1 ? 'proyecto' : 'proyectos'}</div></a></div>
      </div>
    </section>`).join('') + `
    <section class="slide end" id="s${V.length}" data-i="${V.length}">
      <div class="inner">
        <img src="${C.retrato}" alt="${C.nombre}">
        <div>
          <h2>${C.rol}<br>en ${C.ciudad}</h2>
          <p>${C.bio}</p>
          <p class="caps">${C.capacidades}</p>
          <a class="mail" href="mailto:${C.email}">${C.email}</a>
        </div>
      </div>
    </section>`;

  // rejilla global: todos los proyectos de todas las verticales
  $('thumbs').innerHTML = V.flatMap((v,vi) => v.proyectos.map((p,pi) => `
    <a href="#s${vi}" data-open="${vi}:${pi}"><img src="${p.imagenes[0]}" alt="${p.titulo}" loading="lazy"><div class="t"><span><b>${p.titulo}</b> · ${v.titulo}</span><span>${p.ano}</span></div></a>`)).join('');

  $('menu').innerHTML = `<a href="#s0" data-close>Trabajo</a>` + V.map((v,i) => `<a href="#s${i}" data-close>${v.titulo}</a>`).join('') + `<a href="#s${V.length}" data-close>Sobre mí</a><a href="mailto:${C.email}" data-close>Contacto</a>`;

  // pantalla activa + progreso
  const slides = [...document.querySelectorAll('.slide')];
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.intersectionRatio > .55) {
      slides.forEach(s => s.classList.remove('active')); e.target.classList.add('active');
      const i = +e.target.dataset.i;
      $('cur').textContent = i < V.length ? pad(i+1) : '—';
      $('fill').style.height = Math.min(100, (i+1) / V.length * 100) + '%';
    }
  }), {root: $('show'), threshold: [.55]});
  slides.forEach(s => io.observe(s));
  slides[0].classList.add('active');

  // menú desplegable
  function setMenu(open){ $('menu').classList.toggle('open', open); $('menu-btn').setAttribute('aria-expanded', String(open)); $('menu-btn').textContent = open ? 'Cerrar' : 'Menú'; }
  $('menu-btn').onclick = () => setMenu(!$('menu').classList.contains('open'));
  document.addEventListener('click', e => { if (!e.target.closest('#menu') && !e.target.closest('#menu-btn')) setMenu(false); });

  // capas
  function hide(id){ $(id).classList.remove('open'); }
  function show(id){ $(id).classList.add('open'); $(id).scrollTop = 0; }
  function closeAll(){ document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open')); $('grid-btn').setAttribute('aria-expanded','false'); setMenu(false); }
  $('grid-btn').onclick = () => { const open = !$('grid').classList.contains('open'); closeAll(); if (open) show('grid'); $('grid-btn').setAttribute('aria-expanded', String(open)); };
  document.querySelectorAll('[data-close]').forEach(a => a.addEventListener('click', closeAll));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

  // nivel 1: vertical → cascada de proyectos
  function openVert(vi){
    const v = V[vi];
    $('vert-head').innerHTML = `<button class="x" data-x="vert" aria-label="Cerrar">×</button><h2>${v.titulo}</h2><span>${v.subtitulo || ''}</span>`;
    $('vert-list').innerHTML = v.proyectos.map((p,pi) => `
      <a href="#s${vi}" data-open="${vi}:${pi}"><img src="${p.imagenes[0]}" alt="${p.titulo}" loading="lazy"><div class="t"><span><b>${p.titulo}</b>${p.sector || p.cliente} · ${p.rol || ''}</span><span>${p.ano}</span></div></a>`).join('');
    hide('grid'); hide('ficha'); show('vert');
  }
  // nivel 2: ficha del proyecto
  function openFicha(vi, pi){
    const v = V[vi], p = v.proyectos[pi];
    $('ficha-head').innerHTML = `<button class="x" data-x="ficha" aria-label="Volver a ${v.titulo}">×</button><h2>${p.titulo}</h2><span>${v.titulo}</span>`;
    const meta = [['Cliente', p.cliente], ['Sector', p.sector], ['Año', p.ano], ['Mi papel', p.rol]].filter(m => m[1]);
    $('ficha-body').innerHTML = `
      <div class="meta">${meta.map(m => `<div><small>${m[0]}</small>${m[1]}</div>`).join('')}</div>
      ${p.descripcion ? `<p class="txt">${p.descripcion}</p>` : ''}
      ${p.resultado ? `<p class="res">${p.resultado}</p>` : ''}
      ${p.imagenes.map(src => `<img src="${src}" alt="${p.titulo}" loading="lazy">`).join('')}
      <a href="#s${vi}" class="back" data-back="${vi}">← Volver a ${v.titulo}</a>`;
    hide('grid'); show('ficha');
  }
  document.addEventListener('click', e => {
    const t = e.target;
    const v = t.closest('[data-vert]'); if (v) { e.preventDefault(); closeAll(); openVert(+v.dataset.vert); return; }
    const o = t.closest('[data-open]'); if (o) { e.preventDefault(); const [vi,pi] = o.dataset.open.split(':').map(Number); openFicha(vi, pi); return; }
    const b = t.closest('[data-back]'); if (b) { e.preventDefault(); openVert(+b.dataset.back); return; }
    const x = t.closest('[data-x]'); if (x) {
      if (x.dataset.x === 'ficha') { hide('ficha'); if (!$('vert').classList.contains('open')) closeAll(); }
      else closeAll();
    }
  });
}).catch(err => { document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">No se ha podido cargar contenido.json. Esta web tiene que abrirse desde Netlify (o un servidor), no haciendo doble clic en el archivo.</p>'; console.error(err); });
</script>
