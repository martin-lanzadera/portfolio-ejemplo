<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Art by Luzia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,800;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&display=swap">
<style>
  :root{
    --bg:#0B0B0C; --surface:#141416; --ink:#F4F2EE; --muted:#7E7C78; --line:#2A2A2C;
    --font:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ---- chrome ---- */
  .brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 28px);left:clamp(16px,3.5vw,52px);z-index:20;font-weight:400;font-size:26px;letter-spacing:-.02em}
  .brand b{font-weight:800}
  .brand span{color:var(--muted)}
  .menu-btn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 30px);right:clamp(16px,3.5vw,52px);z-index:30;background:none;border:0;color:var(--ink);cursor:pointer;padding:6px;font:inherit;font-size:12px;letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:12px}
  .menu-btn .bars{display:inline-flex;flex-direction:column;gap:5px;width:22px}
  .menu-btn .bars i{display:block;height:2px;background:var(--ink);transition:transform .25s,opacity .25s}
  .menu-btn[aria-expanded="true"] .bars i:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .menu-btn[aria-expanded="true"] .bars i:nth-child(2){opacity:0}
  .menu-btn[aria-expanded="true"] .bars i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  .menu-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .social{position:fixed;left:clamp(16px,3.5vw,52px);top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:26px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);opacity:.8;writing-mode:vertical-rl;transform:translateY(-50%) rotate(180deg)}
  .social a:hover{color:var(--ink)}
  .progress{position:fixed;right:clamp(16px,3.5vw,52px);top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:14px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .progress .num{writing-mode:vertical-rl}
  .progress .bar{width:1px;height:190px;background:var(--line);position:relative}
  .progress .bar i{position:absolute;left:0;top:0;width:1px;height:0;background:var(--ink);transition:height .4s ease}
  .grid-btn{position:fixed;right:clamp(16px,3.5vw,52px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);z-index:20;width:18px;height:18px;display:grid;grid-template-columns:1fr 1fr;gap:3px;background:none;border:0;padding:0;cursor:pointer}
  .grid-btn b{background:var(--ink);display:block}
  .grid-btn:focus-visible{outline:2px solid var(--ink);outline-offset:6px}

  /* ---- showcase ---- */
  .show{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
  .show::-webkit-scrollbar{display:none}
  .slide{height:100%;scroll-snap-align:start;display:grid;place-items:center;position:relative}
  .slide .frame{position:relative;width:min(66vw,1000px);aspect-ratio:16/8.5;max-height:74vh;overflow:hidden}
  .slide .frame img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);transform:scale(1.06);transition:transform 1.2s ease, filter .8s ease, opacity .8s ease;opacity:.45}
  .slide.active .frame img{transform:scale(1);opacity:.85;filter:grayscale(.15) contrast(1.02)}
  .slide .cap{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
  .slide .cap .n{font-weight:800;font-size:clamp(16px,1.6vw,24px);margin-bottom:.2em;transform:translateX(-4.5em);opacity:.9}
  .slide .cap h2{margin:0;font-weight:800;font-size:clamp(52px,8.5vw,128px);line-height:1;letter-spacing:-.03em;color:transparent;-webkit-text-stroke:1px var(--ink);transition:color .5s ease .15s;text-wrap:balance}
  .slide.active .cap h2{color:var(--ink)}
  .slide .cap .cat{font-style:italic;font-size:clamp(14px,1.3vw,18px);color:var(--ink);margin-top:.9em;opacity:.85}
  .slide .cap a{pointer-events:auto}
  .slide .cap a:focus-visible h2{outline:2px solid var(--ink);outline-offset:8px}

  /* ---- final slide: sobre mí + contacto ---- */
  .slide.end{place-items:center;overflow-y:auto;scrollbar-width:none}
  .slide.end::-webkit-scrollbar{display:none}
  .end .inner{padding:96px 0 120px;box-sizing:border-box}
  .end .inner{width:min(66vw,1000px);display:grid;grid-template-columns:220px 1fr;gap:clamp(24px,4vw,64px);align-items:end}
  .end img{aspect-ratio:3/4;object-fit:cover;filter:grayscale(1)}
  .end h2{font-weight:800;font-size:clamp(34px,4.5vw,64px);line-height:1;letter-spacing:-.03em;margin:0 0 18px}
  .end p{max-width:56ch;color:var(--ink);margin:0 0 14px;font-size:clamp(15px,1.15vw,17px)}
  .end .caps{color:var(--muted);font-size:13px;margin:0 0 26px}
  .end-links{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .end-links a:hover{color:var(--ink)}
  .end .mail{font-weight:800;font-size:clamp(22px,2.6vw,36px);letter-spacing:-.02em;border-bottom:2px solid var(--ink);display:inline-block}

  /* ---- overlays ---- */
  .overlay{position:fixed;inset:0;background:var(--bg);z-index:25;display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 96px) clamp(16px,3.5vw,52px) 48px}
  .overlay.open{display:block}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;max-width:1300px;margin:0 auto}
  .thumbs a{display:block}
  .thumbs img{aspect-ratio:16/10;object-fit:cover;filter:grayscale(1);transition:filter .3s}
  .thumbs a:hover img{filter:none}
  .thumbs .t{display:flex;justify-content:space-between;font-size:13px;padding-top:8px;color:var(--muted)}
  .thumbs .t b{color:var(--ink);font-weight:500}
  /* ---- menú desplegable ---- */
  .dropdown{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);right:clamp(16px,3.5vw,52px);z-index:30;background:var(--bg);border:1px solid var(--line);min-width:200px;padding:8px 0;display:none}
  .dropdown.open{display:block}
  .dropdown a{display:block;padding:12px 22px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .dropdown a:hover,.dropdown a:focus-visible{color:var(--ink);background:var(--line);outline:none}

  /* ---- cabecera de galería y rejilla, con × a la izquierda del título ---- */
  .head{max-width:1100px;margin:0 auto 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .head .x{background:none;border:1px solid var(--line);color:var(--ink);cursor:pointer;width:44px;height:44px;border-radius:50%;font:inherit;font-size:22px;line-height:1;display:grid;place-items:center;flex:none}
  .head .x:hover{border-color:var(--ink)}
  .head .x:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .head h2{margin:0;font-weight:800;font-size:clamp(34px,5vw,64px);letter-spacing:-.03em;line-height:1}
  .head span{color:var(--muted);font-size:13px;flex-basis:100%;padding-left:62px}
  .thumbs{max-width:1100px}

  /* ---- cascada de proyectos de una vertical: todas las portadas iguales, a ancho completo, recortadas para encajar ---- */
  .cascade{max-width:1100px;margin:0 auto;display:grid;gap:36px}
  .cascade a{display:block}
  .cascade img{width:100%;aspect-ratio:21/9;object-fit:cover;object-position:center;filter:grayscale(1);transition:filter .3s,transform .5s;background:var(--line)}
  .cascade a:hover img{filter:none;transform:scale(1.01)}
  .cascade .t{display:flex;justify-content:space-between;gap:12px;padding-top:12px;font-size:13px;color:var(--muted)}
  .cascade .t b{color:var(--ink);font-weight:800;font-size:clamp(20px,2vw,28px);letter-spacing:-.02em;display:block}

  /* ---- ficha de proyecto ---- */
  .ficha{max-width:1100px;margin:0 auto;display:grid;gap:18px}
  .ficha .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px 24px;padding:18px 0 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:8px}
  .ficha .meta small{display:block;color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px}
  .ficha .txt{max-width:62ch;font-size:clamp(15px,1.15vw,17px)}
  .ficha .res{max-width:62ch;border-left:2px solid var(--ink);padding-left:14px;color:var(--ink)}
  .ficha img{width:100%}
  .ficha .back{margin-top:28px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .ficha .back:hover{color:var(--ink)}

  /* ---- galería de proyecto ---- */
  .gal{z-index:26}
  .gal .pics{max-width:1100px;margin:0 auto;display:grid;gap:18px}
  .gal .pics img{width:100%}

  /* ================= MÓVIL ================= */
  @media (max-width:700px){
    .brand{font-size:22px;top:calc(env(safe-area-inset-top,0px) + 18px);left:16px}
    .menu-btn{top:calc(env(safe-area-inset-top,0px) + 16px);right:12px;padding:10px}
    .menu-btn .txt{display:none}
    .dropdown{top:0;right:0;left:0;bottom:0;border:0;z-index:29;padding:calc(env(safe-area-inset-top,0px) + 90px) 24px 40px;display:none;flex-direction:column;gap:6px}
    .dropdown.open{display:flex}
    .dropdown a{font-size:28px;font-weight:800;letter-spacing:-.02em;text-transform:none;padding:14px 0;border-bottom:1px solid var(--line);color:var(--ink)}
    .dropdown a:hover{background:none}
    /* pantallas: imagen de lado a lado, título encima */
    .slide{place-items:stretch}
    .slide .frame{width:100%;height:100%;max-height:none;aspect-ratio:auto}
    .slide .cap{align-content:end;justify-items:start;text-align:left;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 96px)}
    .slide .cap .n{transform:none;font-size:14px;color:var(--ink);opacity:.7;margin-bottom:6px}
    .slide .cap h2{font-size:clamp(44px,15vw,72px);text-wrap:balance}
    .slide .cap .cat{font-size:15px;margin-top:8px}
    .slide.active .frame img{opacity:.7}
    /* enlaces sociales: abajo, en horizontal y legibles */
    .social{writing-mode:horizontal-tb;transform:none;top:auto;left:20px;right:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);flex-direction:row;gap:18px;font-size:12px;letter-spacing:.16em;opacity:.9}
    /* progreso: número abajo a la derecha, sin barra */
    .progress{top:auto;transform:none;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);right:16px;flex-direction:row;gap:6px;font-size:13px}
    .progress .num{writing-mode:horizontal-tb}
    .progress .bar{display:none}
    .progress .num:last-child::before{content:"/ "}
    .grid-btn{right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
    /* capas: cabecera compacta, imágenes a sangre */
    .overlay{padding:calc(env(safe-area-inset-top,0px) + 80px) 0 40px}
    .head{padding:0 16px;gap:12px;margin-bottom:18px}
    .head .x{width:38px;height:38px;font-size:20px}
    .head h2{font-size:34px}
    .head span{padding-left:50px;font-size:12px}
    .thumbs{grid-template-columns:1fr;gap:20px;padding:0 16px}
    .cascade{gap:28px}
    .cascade img{aspect-ratio:4/3}
    .cascade .t{padding:10px 16px 0}
    .ficha{gap:14px}
    .ficha .meta{margin:0 16px 4px;grid-template-columns:1fr 1fr;gap:12px 16px}
    .ficha .txt,.ficha .res,.ficha .back{margin-left:16px;margin-right:16px}
    /* ficha final */
    .slide.end{place-items:start}
    .end .inner{width:100%;grid-template-columns:1fr;gap:20px;padding:96px 24px calc(env(safe-area-inset-bottom,0px) + 110px);align-items:start;min-height:100%}
    .end img{max-width:140px}
    .end h2{font-size:36px}
    .end p{font-size:15px}
    .end .mail{font-size:22px}
  }

  :root[data-skin="mosaico"] body::before,:root[data-skin="editorial"] body::before{content:"";position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 92px);background:linear-gradient(var(--bg) 55%,transparent);z-index:15;pointer-events:none}
  /* ================= SKIN: MOSAICO (columna + bloques) ================= */
  :root[data-skin="mosaico"] .progress,:root[data-skin="mosaico"] .grid-btn,:root[data-skin="mosaico"] .social,:root[data-skin="mosaico"] .brand,:root[data-skin="mosaico"] body::before{display:none}
  :root[data-skin="mosaico"] .show{scroll-snap-type:none}
  .split{height:100%;display:grid;grid-template-columns:minmax(300px,30%) 1fr;gap:6px;padding:6px;box-sizing:border-box;background:var(--bg)}
  .who{display:flex;flex-direction:column;justify-content:space-between;gap:20px;padding:clamp(20px,2.6vw,40px);background:var(--surface,#141416);min-height:0}
  .who h1{margin:0;font-size:clamp(28px,2.6vw,42px);line-height:1.05;letter-spacing:-.03em;font-weight:400}
  .who h1 b{font-weight:800}
  .who h1 span{color:var(--muted)}
  .who .rol{margin:8px 0 0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .who img{width:100%;flex:1;min-height:0;object-fit:cover;filter:grayscale(1);aspect-ratio:auto}
  .who .bio{margin:0 0 14px;font-size:14px;line-height:1.55;color:var(--ink);opacity:.85;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .who .mail{font-weight:800;font-size:clamp(16px,1.3vw,20px);letter-spacing:-.01em;border-bottom:2px solid var(--ink)}
  .who .end-links{margin-top:14px;font-size:11px}
  .blocks{display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-auto-rows:1fr;grid-auto-flow:dense;gap:6px;min-height:0}
  .block{position:relative;display:block;overflow:hidden;background:var(--line);min-height:0}
  .block.tall{grid-row:span 2}
  .block img{width:100%;height:100%;object-fit:cover;filter:grayscale(.6) contrast(1.05);transition:transform .7s ease,filter .4s}
  .block:hover img,.block:focus-visible img{transform:scale(1.04);filter:none}
  .block .lbl{position:absolute;left:0;right:0;bottom:0;padding:clamp(16px,1.8vw,28px);color:#fff;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:linear-gradient(transparent,rgba(0,0,0,.7))}
  .block .lbl b{display:block;text-transform:none;letter-spacing:-.03em;font-weight:800;font-size:clamp(28px,3.4vw,56px);line-height:1;margin-bottom:6px}
  :root[data-skin="mosaico"] .menu-btn{mix-blend-mode:difference}
  @media (max-width:820px){
    .split{height:auto;min-height:100%;grid-template-columns:1fr;padding:0;gap:4px}
    .who{padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 24px;display:grid;grid-template-columns:96px 1fr;grid-template-areas:"img top" "img bottom";column-gap:16px;row-gap:8px}
    .who .who-top{grid-area:top}.who img{grid-area:img;aspect-ratio:3/4;height:auto}.who .who-bottom{grid-area:bottom}
    .who h1{font-size:26px}
    .who .bio{-webkit-line-clamp:3;font-size:13px}
    .who .end-links{margin-top:8px}
    .blocks{grid-template-columns:1fr 1fr;grid-auto-rows:34vw}
    .block.tall{grid-row:span 1}
    .block .lbl{padding:12px}.block .lbl b{font-size:22px}
  }

  /* ================= SKIN: EDITORIAL ================= */
  :root[data-skin="editorial"]{--bg:#F3EFE7;--ink:#151412;--muted:#7A736A;--line:#DCD5C8;--serif:"Fraunces","Playfair Display",Georgia,"Times New Roman",serif}
  :root[data-skin="editorial"] .progress,:root[data-skin="editorial"] .grid-btn{display:none}
  :root[data-skin="editorial"] .show{scroll-snap-type:none}
  :root[data-skin="editorial"] .brand{font-family:var(--serif);font-weight:400;font-size:28px;letter-spacing:0}
  :root[data-skin="editorial"] .brand b{font-weight:600;font-style:italic}
  :root[data-skin="editorial"] .social{color:var(--muted)}
  :root[data-skin="editorial"] .dropdown{background:var(--bg)}
  .ed-hero{min-height:70vh;display:grid;align-content:end;padding:0 clamp(16px,8vw,140px) 8vh;border-bottom:1px solid var(--line)}
  .ed-hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(56px,10vw,160px);line-height:.95;letter-spacing:-.02em;margin:0 0 18px;text-wrap:balance}
  .ed-hero p{margin:0;font-size:clamp(15px,1.3vw,19px);color:var(--muted);font-style:italic;font-family:var(--serif)}
  .ed-vert{padding:8vh clamp(16px,8vw,140px) 4vh;border-bottom:1px solid var(--line)}
  .ed-vt{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin:0 0 6vh;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
  .ed-vt a{border-bottom:1px solid var(--ink)}
  .ed-vt small{font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted);font-style:italic;font-family:var(--serif)}
  .entry{padding:0 0 9vh}
  .entry .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);border-top:1px solid var(--ink);padding-top:12px;margin-bottom:10px}
  .entry h3{font-family:var(--serif);font-weight:400;font-size:clamp(40px,6vw,96px);line-height:1;letter-spacing:-.02em;margin:0 0 28px;text-wrap:balance}
  .entry img{width:100%;aspect-ratio:3/2;object-fit:cover;transition:opacity .3s}
  .entry a:hover img{opacity:.92}
  .entry a:hover h3{font-style:italic}
  :root[data-skin="editorial"] .end{padding:0 clamp(16px,8vw,140px)}
  :root[data-skin="editorial"] .end .inner{width:100%;max-width:1100px;margin:0 auto;padding:10vh 0 14vh}
  :root[data-skin="editorial"] .end h2{font-family:var(--serif);font-weight:400}
  :root[data-skin="editorial"] .end img{filter:none}
  :root[data-skin="editorial"] .head h2,:root[data-skin="editorial"] .cascade .t b{font-family:var(--serif);font-weight:400}
  :root[data-skin="editorial"] .cascade img,:root[data-skin="editorial"] .thumbs img{filter:none}
  :root[data-skin="editorial"] .head .x{border-color:var(--ink)}
  @media (max-width:700px){
    .ed-hero{min-height:60vh}
    :root[data-skin="editorial"] .social{display:none}
  }
</style>

<!-- El contenido vive en contenido.json y se edita desde /admin -->

<a class="brand" href="#s0" id="brand"></a>
<button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu" aria-label="Menú"><span class="txt">Menú</span><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span></button>
<nav class="social" id="social" aria-label="Redes"></nav>
<div class="progress" aria-hidden="true"><span class="num" id="cur">01</span><div class="bar"><i id="fill"></i></div><span class="num" id="tot"></span></div>
<button class="grid-btn" id="grid-btn" aria-label="Ver todos los proyectos" aria-expanded="false" aria-controls="grid"><b></b><b></b><b></b><b></b></button>

<main class="show" id="show"></main>

<nav class="dropdown" id="menu" aria-label="Menú"></nav>
<div class="overlay" id="grid" role="dialog" aria-label="Todos los proyectos"><div class="head"><button class="x" data-x aria-label="Cerrar">×</button><h2>Proyectos</h2></div><div class="thumbs" id="thumbs"></div></div>
<div class="overlay" id="vert" role="dialog" aria-label="Proyectos de la vertical"><div class="head" id="vert-head"></div><div class="cascade" id="vert-list"></div></div>
<div class="overlay gal" id="ficha" role="dialog" aria-label="Ficha del proyecto"><div class="head" id="ficha-head"></div><div class="ficha" id="ficha-body"></div></div>

<script>
fetch('contenido.json?v=' + Date.now()).then(r => r.json()).then(C => {
  const $ = id => document.getElementById(id), pad = n => String(n).padStart(2,'0');
  C.enlaces = Object.fromEntries((C.enlaces || []).map(e => [e.nombre, e.url]));
  C.verticales.forEach(v => (v.proyectos || []).forEach(p => p.imagenes = (p.imagenes || []).map(x => typeof x === 'string' ? x : x.imagen).filter(Boolean)));
  const V = C.verticales.filter(v => v.proyectos && v.proyectos.length);
  const cover = v => v.portada || (v.proyectos[0] && v.proyectos[0].imagenes[0]) || '';
  const marca = (C.marca || C.nombre).replace(/[<>]/g,'');
  $('brand').innerHTML = (/\*[^*]+\*/.test(marca) ? marca.replace(/\*([^*]+)\*/g,'<b>$1</b>') : '<b>' + marca + '</b>') + '<span>.</span>';
  $('tot').textContent = pad(V.length);
  $('social').innerHTML = Object.entries(C.enlaces).map(([k,v]) => `<a href="${v}" target="_blank" rel="noopener">${k}</a>`).join('');

  // ---------- SKIN ----------
  const SKIN = ['showcase','mosaico','editorial'].includes(C.skin) ? C.skin : 'showcase';
  document.documentElement.dataset.skin = SKIN;
  const P = V.flatMap((v,vi) => v.proyectos.map((p,pi) => ({...p, vi, pi, vertical: v.titulo})));
  const endHTML = (cls) => `
    <section class="${cls}" id="s${V.length}" data-i="${V.length}">
      <div class="inner">
        <img src="${C.retrato}" alt="${C.nombre}">
        <div>
          <h2>${C.rol}<br>en ${C.ciudad}</h2>
          <p>${C.bio}</p>
          <p class="caps">${C.capacidades}</p>
          <a class="mail" href="mailto:${C.email}">${C.email}</a>
          <div class="end-links">${Object.entries(C.enlaces).map(([k,v]) => `<a href="${v}" target="_blank" rel="noopener">${k}</a>`).join('')}</div>
        </div>
      </div>
    </section>`;

  if (SKIN === 'showcase') {
    // una pantalla por vertical + ficha final
    $('show').innerHTML = V.map((v,i) => `
    <section class="slide" id="s${i}" data-i="${i}">
      <div class="frame">
        <img src="${cover(v)}" alt="${v.titulo}" ${i ? 'loading="lazy"' : ''}>
        <div class="cap"><a href="#s${i}" data-vert="${i}"><div class="n">${pad(i+1)}</div><h2>${v.titulo}</h2><div class="cat">${v.subtitulo || ''} · ${v.proyectos.length} ${v.proyectos.length === 1 ? 'proyecto' : 'proyectos'}</div></a></div>
      </div>
    </section>`).join('') + endHTML('slide end');
  }

  if (SKIN === 'mosaico') {
    // columna fija con la diseñadora + bloques de verticales que llenan la pantalla
    const n = V.length, cols = n <= 4 ? 2 : 3;
    $('show').innerHTML = `
    <section class="split" id="s0" data-i="0">
      <aside class="who">
        <div class="who-top">
          <h1>${$('brand').innerHTML}</h1>
          <p class="rol">${C.rol} · ${C.ciudad}</p>
        </div>
        <img src="${C.retrato}" alt="${C.nombre}">
        <div class="who-bottom">
          <p class="bio">${C.bio}</p>
          <a class="mail" href="mailto:${C.email}">${C.email}</a>
          <div class="end-links">${Object.entries(C.enlaces).map(([k,v]) => `<a href="${v}" target="_blank" rel="noopener">${k}</a>`).join('')}</div>
        </div>
      </aside>
      <div class="blocks" style="--cols:${cols}">
        ${V.map((v,i) => `
        <a class="block ${n % 2 && i === 0 ? 'tall' : ''}" href="#s0" data-vert="${i}">
          <img src="${cover(v)}" alt="${v.titulo}">
          <span class="lbl"><b>${v.titulo}</b>${v.subtitulo || ''} · ${v.proyectos.length} ${v.proyectos.length === 1 ? 'proyecto' : 'proyectos'}</span>
        </a>`).join('')}
      </div>
    </section>`;
  }

  if (SKIN === 'editorial') {
    // editorial: scroll normal, entradas grandes agrupadas por vertical
    $('show').innerHTML = `<header class="ed-hero" id="s0" data-i="0"><h1>${C.nombre}</h1><p>${C.rol} · ${C.ciudad}</p></header>` +
      V.map((v,vi) => `
      <section class="ed-vert" id="s${vi}">
        <h2 class="ed-vt"><a href="#s${vi}" data-vert="${vi}">${v.titulo}</a><small>${v.subtitulo || ''}</small></h2>
        ${v.proyectos.map((p,pi) => `
        <article class="entry">
          <a href="#s${vi}" data-open="${vi}:${pi}">
            <div class="meta"><span>${p.cliente || ''}</span><span>${p.ano}</span></div>
            <h3>${p.titulo}</h3>
            <img src="${p.imagenes[0]}" alt="${p.titulo}" loading="lazy">
          </a>
        </article>`).join('')}
      </section>`).join('') + endHTML('end');
  }

  // rejilla global: todos los proyectos de todas las verticales
  $('thumbs').innerHTML = V.flatMap((v,vi) => v.proyectos.map((p,pi) => `
    <a href="#s${vi}" data-open="${vi}:${pi}"><img src="${p.imagenes[0]}" alt="${p.titulo}" loading="lazy"><div class="t"><span><b>${p.titulo}</b> · ${v.titulo}</span><span>${p.ano}</span></div></a>`)).join('');

  $('menu').innerHTML = `<a href="#s0" data-close>Trabajo</a>` + V.map((v,i) => SKIN === 'showcase' ? `<a href="#s${i}" data-close>${v.titulo}</a>` : `<a href="#s0" data-vert="${i}">${v.titulo}</a>`).join('') + `<a href="#s${V.length}" data-close>Sobre mí</a><a href="mailto:${C.email}" data-close>Contacto</a>`;

  // pantalla activa + progreso
  const slides = [...document.querySelectorAll('.slide')];
  if (slides.length) { const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.intersectionRatio > .55) {
      slides.forEach(s => s.classList.remove('active')); e.target.classList.add('active');
      const i = +e.target.dataset.i;
      $('cur').textContent = i < V.length ? pad(i+1) : '—';
      $('fill').style.height = Math.min(100, (i+1) / V.length * 100) + '%';
    }
  }), {root: $('show'), threshold: [.55]});
  slides.forEach(s => io.observe(s));
  slides[0].classList.add('active'); }

  // menú desplegable
  function setMenu(open){ $('menu').classList.toggle('open', open); $('menu-btn').setAttribute('aria-expanded', String(open)); }
  $('menu-btn').onclick = () => setMenu(!$('menu').classList.contains('open'));
  document.addEventListener('click', e => { if (!e.target.closest('#menu') && !e.target.closest('#menu-btn')) setMenu(false); });

  // capas
  function hide(id){ $(id).classList.remove('open'); }
  function show(id){ $(id).classList.add('open'); $(id).scrollTop = 0; }
  function closeAll(){ document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open')); $('grid-btn').setAttribute('aria-expanded','false'); setMenu(false); }
  $('grid-btn').onclick = () => { const open = !$('grid').classList.contains('open'); closeAll(); if (open) show('grid'); $('grid-btn').setAttribute('aria-expanded', String(open)); };
  document.querySelectorAll('[data-close]').forEach(a => a.addEventListener('click', closeAll));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

  // nivel 1: vertical → cascada de proyectos
  function openVert(vi){
    const v = V[vi];
    $('vert-head').innerHTML = `<button class="x" data-x="vert" aria-label="Cerrar">×</button><h2>${v.titulo}</h2><span>${v.subtitulo || ''}</span>`;
    $('vert-list').innerHTML = v.proyectos.map((p,pi) => `
      <a href="#s${vi}" data-open="${vi}:${pi}"><img src="${p.imagenes[0]}" alt="${p.titulo}" loading="lazy"><div class="t"><span><b>${p.titulo}</b>${p.sector || p.cliente} · ${p.rol || ''}</span><span>${p.ano}</span></div></a>`).join('');
    hide('grid'); hide('ficha'); show('vert');
  }
  // nivel 2: ficha del proyecto
  function openFicha(vi, pi){
    const v = V[vi], p = v.proyectos[pi];
    $('ficha-head').innerHTML = `<button class="x" data-x="ficha" aria-label="Volver a ${v.titulo}">×</button><h2>${p.titulo}</h2><span>${v.titulo}</span>`;
    const meta = [['Cliente', p.cliente], ['Sector', p.sector], ['Año', p.ano], ['Mi papel', p.rol]].filter(m => m[1]);
    $('ficha-body').innerHTML = `
      <div class="meta">${meta.map(m => `<div><small>${m[0]}</small>${m[1]}</div>`).join('')}</div>
      ${p.descripcion ? `<p class="txt">${p.descripcion}</p>` : ''}
      ${p.resultado ? `<p class="res">${p.resultado}</p>` : ''}
      ${p.imagenes.map(src => `<img src="${src}" alt="${p.titulo}" loading="lazy">`).join('')}
      <a href="#s${vi}" class="back" data-back="${vi}">← Volver a ${v.titulo}</a>`;
    hide('grid'); show('ficha');
  }
  document.addEventListener('click', e => {
    const t = e.target;
    const v = t.closest('[data-vert]'); if (v) { e.preventDefault(); closeAll(); openVert(+v.dataset.vert); return; }
    const o = t.closest('[data-open]'); if (o) { e.preventDefault(); const [vi,pi] = o.dataset.open.split(':').map(Number); openFicha(vi, pi); return; }
    const b = t.closest('[data-back]'); if (b) { e.preventDefault(); openVert(+b.dataset.back); return; }
    const x = t.closest('[data-x]'); if (x) {
      if (x.dataset.x === 'ficha') { hide('ficha'); if (!$('vert').classList.contains('open')) closeAll(); }
      else closeAll();
    }
  });
}).catch(err => { document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">No se ha podido cargar contenido.json. Esta web tiene que abrirse desde Netlify (o un servidor), no haciendo doble clic en el archivo.</p>'; console.error(err); });
</script>
